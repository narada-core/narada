[package]
name = "narada-agent-runtime-server-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
narada-nars-session-authority = { path = "../../nars-session-authority/native" }
narada-nars-session-core = { path = "../../nars-session-core/native" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }

[[bin]]
name = "narada-agent-runtime-server-rust"
path = "src/main.rs"
