[package]
name = "narada-invokable-intelligence-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.8"

[[bin]]
name = "narada-intelligence-preflight"
path = "src/main.rs"
